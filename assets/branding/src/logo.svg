<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560">
  <!-- Helicoptea wordmark. Type: Palatino Linotype (Windows system font), as in the in-game title.
       Rendered to PNG by tools/branding/build.mjs; the PNG is the shipped asset. -->
  <defs>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#160c07" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd987"/>
      <stop offset="1" stop-color="#e99a2f"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#efe2c8"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8f1e4" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#f8f1e4" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f8f1e4" stop-opacity="0.15"/>
      <stop offset="0.82" stop-color="#f8f1e4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f8f1e4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g filter="url(#lift)">
    <!-- spinning rotor: motion disc, two tapered blades, hub and mast -->
    <g transform="translate(640 96)">
      <ellipse cx="0" cy="0" rx="470" ry="30" fill="none" stroke="url(#blade)" stroke-width="6"/>
      <path d="M-14 -5 L-455 -2 Q-468 2 -455 6 L-14 7 Z" fill="#2a1d16" stroke="#f8f1e4" stroke-width="4" stroke-linejoin="round"/>
      <path d="M14 -5 L455 -2 Q468 2 455 6 L14 7 Z" fill="#2a1d16" stroke="#f8f1e4" stroke-width="4" stroke-linejoin="round"/>
      <rect x="-20" y="-14" width="40" height="26" rx="10" fill="#c8553d" stroke="#f8f1e4" stroke-width="5"/>
      <rect x="-7" y="12" width="14" height="26" rx="3" fill="#f8f1e4" stroke="#2a1d16" stroke-width="3"/>
    </g>
    <!-- wordmark -->
    <text x="640" y="318" text-anchor="middle" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-weight="700" font-size="212" letter-spacing="-4" stroke="#2a1d16" stroke-width="20" stroke-linejoin="round" paint-order="stroke" fill="url(#cream)">Helicop<tspan font-style="italic" fill="url(#honey)">tea</tspan></text>
    <!-- string and tea bag hanging off the end of "tea" -->
    <path d="M1124 250 C1136 300, 1128 340, 1134 378" fill="none" stroke="#2a1d16" stroke-width="11" stroke-linecap="round"/>
    <path d="M1124 250 C1136 300, 1128 340, 1134 378" fill="none" stroke="#f8f1e4" stroke-width="4.5" stroke-linecap="round"/>
    <g transform="translate(1134 376) rotate(-5)">
      <rect x="-36" y="0" width="72" height="84" rx="7" fill="#d6b382" stroke="#2a1d16" stroke-width="7"/>
      <rect x="-28" y="8" width="56" height="68" rx="4" fill="none" stroke="#f8f1e4" stroke-opacity="0.85" stroke-width="2.5" stroke-dasharray="5 6"/>
      <rect x="-23" y="24" width="46" height="22" rx="3" fill="#c8553d"/>
      <text x="0" y="41" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="16" fill="#fff8ef">TEA</text>
    </g>
    <!-- tagline -->
    <text x="610" y="418" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="34" letter-spacing="8" stroke="#2a1d16" stroke-width="9" stroke-linejoin="round" paint-order="stroke" fill="#f8f1e4">TINY HELICOPTERS · PROPER TEA</text>
  </g>
</svg>
