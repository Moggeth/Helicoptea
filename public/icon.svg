<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Helicoptea app icon: a little helicopter dipping a tea bag into a mug. Bold shapes so it
       still reads at 16-32 px. Rendered to PNG/ICO by tools/branding/build.mjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f2b84b"/>
      <stop offset="0.55" stop-color="#e07b3e"/>
      <stop offset="1" stop-color="#b8472f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.7" stop-color="#f3e7d0"/>
      <stop offset="1" stop-color="#d9c6a6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a66"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
    <clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <g transform="translate(28 30) scale(0.88)">
    <!-- steam -->
    <g fill="none" stroke="#fff8ec" stroke-opacity="0.75" stroke-width="13" stroke-linecap="round">
      <path d="M196 318 c-16 -20 14 -30 -2 -52"/>
      <path d="M318 318 c-16 -20 14 -30 -2 -52"/>
    </g>

    <!-- mug -->
    <path d="M372 362 h18 a44 44 0 0 1 0 88 h-26" fill="none" stroke="#2a1d16" stroke-width="40" stroke-linecap="round"/>
    <path d="M372 362 h18 a44 44 0 0 1 0 88 h-26" fill="none" stroke="#f3e7d0" stroke-width="20" stroke-linecap="round"/>
    <path d="M130 330 h258 v104 a62 62 0 0 1 -62 62 h-134 a62 62 0 0 1 -62 -62 z" fill="url(#mug)" stroke="#2a1d16" stroke-width="16" stroke-linejoin="round"/>
    <ellipse cx="259" cy="334" rx="121" ry="16" fill="#7a3f1e" stroke="#2a1d16" stroke-width="10"/>
    <path d="M160 374 h44" stroke="#c8553d" stroke-width="14" stroke-linecap="round"/>

    </g>

    <!-- string and tea bag dipping in -->
    <path d="M256 180 L256 318" stroke="#2a1d16" stroke-width="14" stroke-linecap="round"/>
    <path d="M256 180 L256 318" stroke="#fff8ec" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(256 236)">
      <rect x="-22" y="0" width="44" height="34" rx="5" fill="#fff8ec" stroke="#2a1d16" stroke-width="8"/>
      <rect x="-14" y="17" width="28" height="9" rx="2" fill="#c8553d"/>
    </g>

    <!-- helicopter (side view, nose left) -->
    <g transform="translate(256 132)">
      <ellipse cx="0" cy="-74" rx="196" ry="13" fill="#fff8ec" fill-opacity="0.35"/>
      <rect x="-190" y="-80" width="380" height="13" rx="6.5" fill="#2a1d16"/>
      <rect x="-10" y="-74" width="20" height="30" rx="4" fill="#2a1d16"/>
      <!-- tail boom and fin -->
      <path d="M40 -20 L176 -30 L176 -14 L40 8 Z" fill="#fff8ec" stroke="#2a1d16" stroke-width="10" stroke-linejoin="round"/>
      <path d="M160 -34 L178 -66 L196 -66 L190 -14 L172 -14 Z" fill="#16203a" stroke="#2a1d16" stroke-width="9" stroke-linejoin="round"/>
      <!-- cabin -->
      <path d="M-96 -2 C-96 -46 -52 -54 -8 -54 C40 -54 70 -36 70 -2 C70 30 40 40 -8 40 C-60 40 -96 30 -96 -2 Z" fill="url(#body)" stroke="#2a1d16" stroke-width="10"/>
      <path d="M-86 -10 C-80 -38 -52 -44 -26 -44 L-26 -4 Z" fill="#bcd3e6" stroke="#2a1d16" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-14 -46 C20 -46 50 -38 60 -20 L-14 -20 Z" fill="#fff8ec"/>
      <path d="M-90 12 C-40 16 20 16 66 8" fill="none" stroke="#c8553d" stroke-width="7" stroke-linecap="round"/>
      <!-- skids -->
      <path d="M-50 38 L-58 58 M30 38 L38 58" stroke="#2a1d16" stroke-width="9" stroke-linecap="round"/>
      <path d="M-96 60 L72 60" stroke="#2a1d16" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>
</svg>
